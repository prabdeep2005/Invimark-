[project]
name = "invimark"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "pillow",
    "numpy",
    "pydantic",
    "onnxruntime",
]

 [project.scripts]
 dev = "src.main:main"

[dependency-group]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]



[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I" ,"B" , "UP"]

